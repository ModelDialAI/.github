<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">ModelDial 综合分：五个维度按公开权重加权</title>
  <desc id="desc">表盘一圈为 100 分，按权重切成五段：知识推理 35%、后端工程 20%、前端交互 20%、视觉审美 15%、可维护性 10%。各维度满分 100，在自建私有评测集上实测，按思考档位分别记录，并附评测耗时与参考费用。</desc>
  <rect width="1200" height="500" rx="24" fill="#07070b"/>

